<!doctype html>
<html lang="es">
<head>
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<meta name="darkreader-lock">
<style>:root{color-scheme:light only;} html,body{color-scheme:light only;}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#FBF1E7">
<meta name="apple-mobile-web-app-title" content="Agenda Naif">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF1E7;
    --ink: #1F1F1F;
    --grey: #8A8A8A;
    --line: #D9D3CD;
    --blue: #5AAEF2;
    --pink: #F0607A;
    --pill: #C6E4FA;
    --btn: #F1E6DC;
    --note: #C6E4FA;
    --note-line: #A9CFEE;
    --notes-h: 34vh;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    position: relative;
    height: 100vh;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    overflow: hidden;
    padding-top: env(safe-area-inset-top, 0px);
  }
  /* La hoja completa: se mueve con el dedo o la rueda y cambia de día */
  .page {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    will-change: transform;
  }
  svg.ico {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Encabezado */
  .header {
    display: flex;
    align-items: center;
    padding: 8px 14px 16px;
  }
  .flower { width: 64px; flex: none; display: flex; justify-content: center; }
  .center { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; }
  .date-row { display: flex; align-items: center; gap: 8px; }
  .arrow {
    background: none; border: 0; padding: 4px; color: var(--ink);
    cursor: pointer; display: flex;
  }
  .arrow svg.ico { width: 20px; height: 20px; }
  .weekday {
    font-size: clamp(22px, 7vw, 30px);
    white-space: nowrap;
    letter-spacing: -0.3px;
  }
  .month {
    margin-top: 2px;
    font-weight: 700;
    font-size: 10px;
    background: rgba(255, 255, 255, .55);
    border-radius: 10px;
    padding: 3px 10px;
    display: inline-block;
    letter-spacing: 3.5px;
    color: var(--grey);
    white-space: nowrap;
  }
  .today-btn {
    margin-top: 12px;
    font: inherit; font-size: 12px; font-weight: 700; letter-spacing: 2px;
    background: var(--pill); color: var(--ink);
    border: 0; border-radius: 14px; padding: 4px 14px;
    cursor: pointer;
  }
  .avatar {
    width: 64px; height: 64px; flex: none;
    border-radius: 50%;
    background: #E9E2DB;
    display: flex; align-items: center; justify-content: center;
    color: var(--grey);
    overflow: hidden;
  }
  .avatar svg.ico { width: 30px; height: 30px; }

  /* Cuerpo: citas + botones laterales. El borde inferior reserva lugar para el panel de notas */
  .body {
    flex: 1; min-height: 0; display: flex;
    padding-bottom: var(--notes-h);
    transition: padding-bottom .25s ease;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .left { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 4px 0 0 18px; }
  .add-pill {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--pill); border: 0; border-radius: 24px;
    padding: 11px 18px;
    font: inherit; font-size: 17px; color: var(--ink);
    cursor: pointer;
  }
  .add-pill svg.ico { width: 20px; height: 20px; stroke-width: 2; }
  .list {
    flex: 1; min-height: 0;
    margin-top: 12px;
    padding-bottom: 12px;
  }
  .empty { color: var(--grey); font-size: 15px; padding: 16px 0; margin: 0; }
  .row {
    display: flex; align-items: center;
    min-height: 52px;
    border-bottom: 1px solid var(--line);
    padding-right: 6px;
  }
  .check {
    width: 24px; height: 24px; flex: none;
    border-radius: 50%; border: 2px solid var(--grey);
    background: none; padding: 0; margin-right: 12px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .check.done { border-color: var(--blue); background: var(--pill); }
  .check svg { width: 14px; height: 14px; stroke: var(--blue); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .time { width: 46px; flex: none; font-size: 14px; color: var(--grey); }
  .bar { width: 3px; height: 22px; flex: none; border-radius: 2px; margin-right: 12px; }
  .text { flex: 1; min-width: 0; font-size: 17px; word-break: break-word; }
  .text.done { color: var(--grey); text-decoration: line-through; }

  .right { width: 78px; flex: none; padding-top: 8px; display: flex; justify-content: center; }
  .tools { display: flex; flex-direction: column; gap: 16px; }
  .tool {
    width: 44px; height: 44px; padding: 0;
    border: 0; border-radius: 12px; background: var(--btn);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--ink);
  }
  .tool.active { background: var(--pill); }
  .tool svg.ico { width: 22px; height: 22px; }

  /* Notas: panel anclado al pie; se puede bajar, o ampliar con el lápiz */
  .app.notes-open { --notes-h: 72vh; }
  .app.notes-collapsed { --notes-h: 76px; }
  .app.notes-collapsed textarea#notes { display: none; }
  .notes {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: var(--notes-h);
    bottom: var(--kb, 0px);
    min-height: 200px;
    z-index: 5;
    transition: height .25s ease;
    background: var(--note);
    border-radius: 26px 26px 0 0;
    padding: 16px 18px env(safe-area-inset-bottom, 0px);
    display: flex; flex-direction: column;
  }
  .notes-head { display: flex; justify-content: space-between; align-items: center; touch-action: none; cursor: grab; }
  .notes-title { font-size: 13px; letter-spacing: 5px; }
  .icon-btn { background: none; border: 0; padding: 4px; color: var(--ink); cursor: pointer; display: flex; border-radius: 10px; }
  .icon-btn svg.ico { width: 22px; height: 22px; }
  .icon-btn.active { background: #FFFFFF; }
  textarea#notes {
    flex: 1; min-height: 0; width: 100%;
    margin-top: 10px;
    border: 0; outline: none; resize: none;
    background: transparent;
    font: inherit; font-size: 17px; line-height: 28px;
    color: var(--ink);
    padding: 0;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 27px, var(--note-line) 27px, var(--note-line) 28px);
    background-attachment: local;
  }

  /* Ventanas emergentes (por encima de todo, incluido el panel de notas) */
  .modal {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(0, 0, 0, .25);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .add-modal { align-items: flex-start; padding-top: 10vh; }
  .sheet {
    width: 100%; max-width: 340px;
    background: var(--bg); border-radius: 18px; padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .form {
    width: 100%; max-width: 360px;
    background: var(--pill); border-radius: 18px;
    padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .form input, .date-pick {
    width: 100%;
    font: inherit; font-size: 16px;
    border: 0; border-radius: 10px;
    padding: 10px 12px;
    background: #fff; color: var(--ink);
    outline: none;
    text-align: left;
  }
  .date-pick { cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
  .date-pick svg.ico { width: 18px; height: 18px; color: var(--grey); }
  .form .actions { display: flex; justify-content: flex-end; gap: 8px; }
  .error { margin: 0; color: var(--pink); font-size: 13px; min-height: 0; }
  .btn { font: inherit; font-size: 15px; border: 0; border-radius: 12px; padding: 9px 14px; cursor: pointer; }
  .btn.ghost { background: none; color: var(--grey); }
  .btn.primary { background: var(--blue); color: #fff; font-weight: 700; }

  /* Calendario */
  .cal-head { display: flex; align-items: center; justify-content: space-between; }
  .cal-title { font-size: 17px; font-weight: 700; }
  .cal-nav { background: none; border: 0; padding: 6px; color: var(--ink); cursor: pointer; display: flex; }
  .cal-nav svg.ico { width: 20px; height: 20px; }
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
  }
  .dow { text-align: center; font-size: 12px; color: var(--grey); padding: 4px 0; }
  .day {
    aspect-ratio: 1 / 1;
    border: 0; border-radius: 50%;
    background: none; color: var(--ink);
    font: inherit; font-size: 15px;
    cursor: pointer; padding: 0;
  }
  .day.today { box-shadow: inset 0 0 0 1.5px var(--blue); }
  .day.sel { background: var(--blue); color: #fff; font-weight: 700; }
  .cal-foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .cal-foot-right { display: flex; gap: 6px; }
  .sheet .btn.ghost { color: var(--blue); font-weight: 700; }
  .sheet .btn.primary { background: var(--blue); }

  /* Menú de cada cita */
  .menu-title { margin: 4px 4px 8px; font-size: 17px; font-weight: 700; text-align: center; word-break: break-word; }
  .menu-body, .confirm-body { display: flex; flex-direction: column; gap: 8px; }
  .menu-btn { font: inherit; font-size: 16px; border: 0; border-radius: 12px; padding: 12px; background: var(--pill); color: var(--ink); cursor: pointer; }
  .menu-btn.danger { color: var(--pink); background: #FFFFFF; }
  .confirm-body p { margin: 0 0 4px; text-align: center; font-size: 16px; }
  .row-btns { display: flex; gap: 8px; }
  .row-btns .menu-btn { flex: 1; }

  /* Fotografías del día: sobre la hoja, se mueven, se redimensionan y se eliminan */
  .photo-layer { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
  .photo {
    position: absolute;
    pointer-events: auto;
    touch-action: none;
    background: #FFFFFF;
    padding: 4px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .18);
  }
  .photo img { display: block; width: 100%; height: auto; border-radius: 5px; pointer-events: none; user-select: none; -webkit-user-select: none; }
  .photo.selected { outline: 2px solid var(--blue); outline-offset: 2px; }
  .photo-del {
    display: none; position: absolute; top: -10px; right: -10px;
    width: 26px; height: 26px; padding: 0; border: 0; border-radius: 50%;
    background: var(--pink); color: #FFFFFF; font-size: 16px; line-height: 26px; cursor: pointer;
  }
  .photo-handle {
    display: none; position: absolute; right: -8px; bottom: -8px;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--blue); border: 2px solid #FFFFFF; cursor: nwse-resize; touch-action: none;
  }
  .photo.selected .photo-del, .photo.selected .photo-handle { display: block; }

  /* Botón de fotos: el selector de archivos cubre el botón para abrirse con cada toque */
  .tool-wrap { position: relative; width: 44px; height: 44px; }
  .file-overlay { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }

  /* Dibujo a mano alzada en NOTAS: con el dedo o con lápiz */
  .draw-canvas { flex: 1; min-height: 0; width: 100%; margin-top: 10px; display: block; touch-action: none; cursor: crosshair; }
  .app.notes-collapsed .draw-canvas { display: none; }
  .text-btn { font: inherit; font-size: 14px; background: #FFFFFF; color: var(--ink); border: 0; border-radius: 12px; padding: 4px 12px; cursor: pointer; margin-left: auto; margin-right: 10px; }

  /* Hoja de NOTAS: las rayas quedan siempre visibles, también mientras se dibuja */
  .notes-body {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    margin-top: 10px;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 27px, var(--note-line) 27px, var(--note-line) 28px);
  }
  .notes-body textarea#notes { background-image: none; margin-top: 0; }
  .notes-body { position: relative; }
  .notes-body .draw-canvas { margin-top: 0; position: absolute; inset: 0; width: 100%; height: 100%; }
  .app.notes-collapsed .notes-body { display: none; }

  /* Orden de los botones de NOTAS: Borrar, lápiz, cerrar */
  .notes-head { justify-content: flex-start; }
  #clearDraw { order: 1; }
  #notesPencil { order: 2; margin-left: auto; }
  .text-btn:not([hidden]) ~ #notesPencil { margin-left: 8px; }
  #closeNotes { order: 3; margin-left: 8px; }

  /* Color de lo que escribe la gente: citas, notas, campos y dibujos */
  .text, .menu-title, .form input, .notes-body textarea#notes { color: #694329; }
  .text.done { color: var(--grey); }
  /* Sin horario, la columna de la hora no ocupa espacio: la cita queda junto al tilde */
  .time:empty { display: none; }

  /* Girar la foto: círculo blanco arriba a la izquierda, al seleccionarla */
  .photo-rot {
    display: none; position: absolute; left: -8px; top: -8px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #FFFFFF; border: 2px solid var(--blue); cursor: grab; touch-action: none;
  }
  .photo.selected .photo-rot { display: block; }

  /* Botones de NOTAS: T (teclado), borrar, lápiz y cerrar */
  .note-btn { width: 38px; height: 38px; padding: 0; border: 0; border-radius: 12px; background: #FFFFFF; color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .note-btn svg.ico { width: 20px; height: 20px; }
  .note-btn.active { background: transparent; }
  .note-btn.active:focus, .note-btn.active:active { background: transparent; }
  .note-btn:focus:not(.active), .note-btn:active:not(.active) { background: #FBF0E6; }
  /* El lápiz siempre con fondo beige, también mientras dibuja */
  #notesPencil, #notesPencil:focus:not(.active), #notesPencil:active:not(.active) { background: #FBF0E6; }
  #notesPencil.active, #notesPencil.active:focus, #notesPencil.active:active { background: transparent; }
  .notes-head { justify-content: flex-start; gap: 8px; }
  #textMode { order: 1; margin-left: auto; }
  #clearDraw { order: 2; }
  #notesPencil { order: 3; margin-left: auto; }
  #textMode:not([hidden]) ~ #notesPencil { margin-left: 0; }
  #closeNotes { order: 4; margin-left: 0; }

  /* Diseño final: la columna derecha queda con agenda (calendario) y fotos. NOTAS abierta: T, lápiz, cesto y X */
  #toolList, #toolPencil { display: none !important; }
  #notesPencil { order: 2; }
  #clearDraw { order: 3; }
  .note-btn { background: #FBF0E6; }
  #closeNotes { background: #FBF0E6; }

  /* Cesto: se pone celeste más oscuro mientras lo tocás, para avisar que vas a borrar */
  #clearDraw:active { background: #A9D4F5; }

  /* Foto de perfil: se elige tocando el círculo */
  .avatar { position: relative; }
  #avatarImg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

  /* Florcita: un círculo para elegir el diseño; después se ve el diseño elegido */
  .flower > svg { display: none; }
  .flower-btn { background: none; border: 0; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .flower-circle { width: 56px; height: 56px; border-radius: 50%; background: #C8B29C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; }
  .flower-circle svg.ico { width: 24px; height: 24px; }
  .flower-btn:active .flower-circle { background: #A8927C; }
  #flowerImg { width: 60px; height: 60px; object-fit: contain; }
  .flower-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-height: 60vh; overflow-y: auto; padding: 4px; }
  .flower-tile { aspect-ratio: 1 / 1; border: 0; border-radius: 18px; background: var(--btn); padding: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .flower-tile img { width: 100%; height: 100%; object-fit: contain; }
  .flower-tile.sel { outline: 2px solid var(--blue); outline-offset: 2px; }

  /* Pantalla de ingreso (prueba): cuentas guardadas en este navegador */
  .login {
    position: fixed; inset: 0; z-index: 40;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background-color: var(--bg);
    background-image: radial-gradient(#E6D3BC 2px, transparent 2.5px);
    background-size: 36px 36px;
  }
  .login-card { width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .login-circle { width: 96px; height: 96px; }
  .login-circle svg.ico { width: 40px; height: 40px; }
  .login-title { margin: 6px 0 10px; font-family: "Patrick Hand", "Nunito", cursive; font-weight: 400; font-size: 46px; }
  .login-field {
    width: 100%; display: flex; align-items: center; gap: 12px;
    background: var(--pill); border-radius: 30px; padding: 0 18px; height: 58px;
  }
  .login-field svg.ico { width: 26px; height: 26px; flex: none; }
  .login-field input {
    flex: 1; min-width: 0; border: 0; outline: none; background: transparent;
    font: inherit; font-size: 18px; color: var(--ink);
  }
  .login-field input::placeholder { color: var(--ink); opacity: .75; }
  .login-field #loginEye { background: none; border: 0; padding: 0; cursor: pointer; display: flex; color: var(--ink); }
  .login-field #loginEye svg.ico { width: 24px; height: 24px; }
  .login-links { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .login-links button, .login-sub {
    background: none; border: 0; cursor: pointer; font: inherit; font-size: 16px; color: var(--ink); padding: 4px;
  }
  .login-btn {
    width: 100%; height: 58px; margin-top: 8px; border: 0; border-radius: 30px;
    background: #F24F86; color: #FFFFFF; font: inherit; font-size: 22px; cursor: pointer;
  }
  .login .error { text-align: center; }

  /* Panel de cuenta (vista de prueba: los botones todavía no hacen nada) */
  .acc-title { font-family: "Patrick Hand", "Nunito", cursive; font-size: 34px; margin: 0 0 4px; text-align: center; }
  .acc-user { text-align: center; color: var(--grey); margin: 0 0 12px; font-size: 15px; }
  .acc-status { text-align: center; background: var(--pill); border-radius: 14px; padding: 8px 12px; margin-bottom: 14px; font-size: 15px; }
  .acc-list { display: flex; flex-direction: column; gap: 10px; }
  .acc-btn {
    width: 100%; text-align: left; border: 0; border-radius: 18px; padding: 14px 18px;
    background: var(--btn); color: var(--ink); font: inherit; font-size: 17px; cursor: pointer;
  }
  .acc-btn.danger { color: #B3261E; }
  button:active { filter: brightness(.8); }
  /* Orden de la cabecera de NOTAS: flecha, T, lápiz, borrar, cerrar */
  .notes-head #notesUp { order: 0 !important; }
  .notes-head #textMode { order: 1 !important; margin-left: auto !important; }
  .notes-head #notesPencil { order: 2 !important; margin-left: 8px !important; }
  .notes-head #clearDraw { order: 3 !important; margin-left: 8px !important; }
  .notes-head #closeNotes { order: 4 !important; margin-left: 8px !important; }
  .acc-close { margin-top: 12px; width: 100%; }

  /* Avisos de la cita: casilla "Avisame ese día" y recordatorio al abrir ese día */
  .alert-toggle { display: flex; align-items: center; gap: 10px; background: var(--btn); border-radius: 14px; padding: 10px 14px; font-size: 16px; color: var(--ink); cursor: pointer; }
  .alert-toggle input { width: 18px; height: 18px; accent-color: #5AAEF2; margin: 0; }
  .alert-toggle svg.ico { width: 20px; height: 20px; flex: none; }
  .alert-banner { display: flex; align-items: center; gap: 10px; background: var(--pill); border-radius: 16px; padding: 10px 14px; margin: 0 0 12px; font-size: 16px; color: var(--ink); }
  .alert-banner[hidden] { display: none; }
  .alert-banner svg.ico { width: 20px; height: 20px; flex: none; }
  .alert-banner .alert-text { flex: 1; }
  .alert-x { background: none; border: 0; font-size: 22px; cursor: pointer; color: var(--ink); padding: 0 4px; }

  /* Cartel de recordatorio: cuadrado, color tiza, tapa la pantalla */
  .alert-modal { position: fixed; inset: 0; z-index: 25; background: rgba(60, 40, 20, .25); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .alert-modal[hidden] { display: none; }
  .alert-card {
    width: min(80vw, 340px); aspect-ratio: 1 / 1; background: #FDF9F3; border-radius: 24px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .15); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center;
  }
  .alert-head { margin: 0; font-family: "Patrick Hand", "Nunito", cursive; font-weight: 400; font-size: 40px; }
  .alert-body { display: flex; flex-direction: column; gap: 6px; font-size: 20px; color: var(--ink); }
  .alert-ok { margin-top: 8px; border: 0; border-radius: 30px; background: var(--btn); color: var(--ink); font: inherit; font-size: 17px; padding: 10px 26px; cursor: pointer; }

  /* Fondos de la hoja: tiza (por defecto), con puntitos, celeste claro, celeste con puntitos y celeste con corazones */
  body[data-theme="celeste"], body[data-theme="celeste-puntos"], body[data-theme="celeste-corazones"] { --bg: #EAF5FD; }
  body[data-theme="tiza-puntos"] .app, body[data-theme="celeste-puntos"] .app {
    background-image: radial-gradient(#D9C6AE 1.5px, transparent 2px);
    background-size: 22px 22px;
  }
  body[data-theme="celeste-puntos"] .app {
    background-image: radial-gradient(#A9D4F5 1.5px, transparent 2px);
  }
  body[data-theme="celeste-corazones"] .app {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><path d='M32 46 L20 34 C12 26 17 16 24 18 C28 19 30 22 32 25 C34 22 36 19 40 18 C47 16 52 26 44 34 Z' fill='%23F4A7B9' opacity='.6'/></svg>");
    background-size: 64px 64px;
  }
  .acc-label { text-align: center; margin: 0 0 8px; font-size: 15px; color: var(--grey); }
  .theme-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .theme-tile { width: 46px; height: 46px; border-radius: 14px; border: 2px solid transparent; cursor: pointer; padding: 0; background: #FBF1E7; }
  .theme-tile.sel { border-color: var(--blue); }
  .theme-tile[data-theme="tiza-puntos"] { background-image: radial-gradient(#D9C6AE 1.4px, transparent 2px); background-size: 10px 10px; }
  .theme-tile[data-theme="celeste"] { background: #EAF5FD; }
  .theme-tile[data-theme="celeste-puntos"] { background-color: #EAF5FD; background-image: radial-gradient(#A9D4F5 1.4px, transparent 2px); background-size: 10px 10px; }
  .theme-tile[data-theme="celeste-corazones"] { background-color: #EAF5FD; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24'><path d='M12 17 L7 12 C4 9 6 6 8.5 7 C10 7.6 11 8.5 12 10 C13 8.5 14 7.6 15.5 7 C18 6 20 9 17 12 Z' fill='%23F4A7B9' opacity='.6'/></svg>"); background-size: 24px 24px; }

  /* Personalizar: título chiquito, palo seco y liviano */
  .acc-small { font-family: "Nunito", sans-serif; font-weight: 300; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; text-align: center; color: var(--grey); margin: 0 0 12px; }

  .theme-tile[data-theme="corazones-tiza"] { --tile-bg: #FDF7F1; --tile-pat: var(--pat-corazones-tiza); }
  .theme-tile[data-theme="puntos-tiza"] { --tile-bg: #FCF7F1; --tile-pat: var(--pat-puntos-tiza); }
  .theme-tile[data-theme="corazones-rosa"] { --tile-bg: #F5E8E8; --tile-pat: var(--pat-corazones-rosa); }
  .theme-tile[data-theme="puntos-rosa"] { --tile-bg: #F5E8E8; --tile-pat: var(--pat-puntos-rosa); }
  .theme-tile[data-theme="corazones-celeste"] { --tile-bg: #E3F3FE; --tile-pat: var(--pat-corazones-celeste); }
  .theme-tile[data-theme="puntos-celeste"] { --tile-bg: #E1F2FE; --tile-pat: var(--pat-puntos-celeste); }


  /* Selector de fondos: cuadraditos en grilla de 3 columnas, con filete gris fino para que no se pierdan */
  .theme-row { display: grid; grid-template-columns: repeat(3, 56px); justify-content: center; gap: 12px; margin: 0 auto 16px; }
  .theme-tile { width: 56px; height: 56px; border-radius: 14px; border: 1px solid rgba(128, 128, 128, .5); box-sizing: border-box; padding: 0; cursor: pointer; }
  .theme-tile.sel { border: 2px solid var(--blue); }

  /* Computadora y tablet: hoja más ancha, con margen a la izquierda para el checklist */
  @media (min-width: 720px) {
    .app { max-width: 900px; }
    .list { padding-left: 44px; }
    .add-pill { margin-left: 44px; }
    .notes-body { margin-right: 24px; }
  }

  /* Circulito de checklist en el margen (solo en computadora y tablet) */
  .check-start { display: none; }
  @media (min-width: 720px) {
    .left { position: relative; }
    .check-start {
      display: none; position: absolute; left: 8px; top: 15px;
      width: 26px; height: 26px; border-radius: 50%; padding: 0; cursor: pointer;
      border: 1.5px solid rgba(128, 128, 128, .6); background: transparent;
    }
  }

  /* NOTAS cerrado: queda solo la barra abajo, y las citas ganan lugar. Al tocar el lapicito, la hoja sube */
  .app:not(.notes-open) { --notes-h: 76px; }
  .app:not(.notes-open) .notes { height: 76px !important; min-height: 76px !important; }
  .app:not(.notes-open) .notes-body,
  .app:not(.notes-open) textarea#notes { display: none !important; }

  /* Interruptor de sonido: megáfono con o sin ondas */
  .sound-toggle { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; margin: 0 auto 12px; border: 0; border-radius: 14px; background: var(--btn); color: var(--ink); cursor: pointer; padding: 0; }
  .sound-toggle svg.ico { width: 20px; height: 20px; }

  /* Tapa de ingreso nueva: título en mayúsculas, botones claros y SOY NUEVO con borde */
  .login-title { font-family: "Nunito", sans-serif; font-weight: 800; font-size: 34px; letter-spacing: 3px; color: #7A5230; margin: 6px 0 10px; }
  .login-links button { font-size: 13px; letter-spacing: 1px; text-decoration: underline; }
  .login-btn { letter-spacing: 2px; background: #EC4D8A; font-weight: 700; font-size: 20px; }
  .login-sub { width: 88%; border: 2px solid #EC4D8A; border-radius: 30px; color: #EC4D8A; font-weight: 700; letter-spacing: 2px; padding: 12px 0; font-size: 15px; background: transparent; }

  /* Lápiz de NOTAS al lado de la palabra NOTAS */
  #notesPencil { order: 0 !important; margin-left: 12px !important; }

  /* Flechita junto a NOTAS: sube la hoja. Con la hoja abierta, aparece el lápiz */
  .note-up { background: none; border: 0; padding: 4px 10px; cursor: pointer; color: var(--ink); display: flex; align-items: center; }
  .note-up svg.ico { width: 20px; height: 20px; }
  .app.notes-open #notesUp svg { transform: rotate(180deg); }
  .app:not(.notes-open) #notesPencil { display: none !important; }

  /* Portada Agenda Mate: verde oliva sobre crema con puntitos */
  .login { background-color: #FBF3E6; background-image: radial-gradient(#A9B07F 2px, transparent 2.5px); background-size: 36px 36px; }
  .login-circle { background: #8A9A5B !important; }
  .login-title { color: #8A9A5B; font-weight: 800; font-size: 40px; letter-spacing: 2px; line-height: 1.05; }
  .login-links button { color: #8A9A5B; }
  .login-btn { background: #8A9A5B; }
  .login-sub { border-color: #8A9A5B; color: #8A9A5B; background: #FBF3E6; }

  /* Logo de la portada: el de la imagen de referencia */
  .login-logo { width: 118px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .login-logo-circle { width: 98px; height: auto; display: block; cursor: pointer; }
  .login-logo-text { width: 118px; height: auto; display: block; }
  .login-links button { background: #FBF3E6; padding: 4px 12px; border-radius: 10px; text-decoration: none !important; }

  /* Tapa final: fondo liso, enlaces sin subrayado */
  .login { background-image: none !important; background-color: #FDF8EE !important; }
  .login-links button { background: none !important; text-decoration: none !important; padding: 4px 8px; }
  .login-sub { background: #FBF6EC !important; }

  /* La grilla de stickers tiene que verse por encima de la tapa */
  #flowerModal { z-index: 60 !important; }

  /* Interior en verde claro: HOY, notas y dos fondos verdes (liso y con puntitos chiquitos) */
  .today-btn { background: #C0C9A1 !important; }
  .notes { background: #C0C9A1 !important; }
  .notes-body { background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 27px, #B9C395 27px, #B9C395 28px) !important; }
  body[data-theme="liso-verde"] { --bg: #E0E3D3; }
  body[data-theme="puntos-verde"] { --bg: #CCD4AE; }
  body[data-theme="puntos-verde"] .app { background-image: radial-gradient(#FFFFFF 1.4px, transparent 1.8px); background-size: 12px 12px; }
  .theme-tile[data-theme="liso-verde"] { --tile-bg: #E0E3D3; }
  .theme-tile[data-theme="puntos-verde"] { --tile-bg: #CCD4AE; --tile-pat: radial-gradient(#FFFFFF 1.4px, transparent 1.8px); --tile-size: 12px; }

  /* El panel de cuenta se puede desplazar si no entra en la pantalla */
  #accountModal .sheet { max-height: 88vh; overflow-y: auto; }

  /* Fondos lisos nuevos: amarillo y lila */
  body[data-theme="liso-amarillo"] { --bg: #FFFBD6; }
  body[data-theme="liso-lila"] { --bg: #EDD0E4; }
  .theme-tile[data-theme="liso-amarillo"] { --tile-bg: #FFFBD6; }
  .theme-tile[data-theme="liso-lila"] { --tile-bg: #EDD0E4; }

  /* Aviso breve */
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: var(--ink); color: #fff;
    padding: 10px 16px; border-radius: 12px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
    max-width: 90%; text-align: center; z-index: 20;
  }
  .toast.show { opacity: 1; }
</style>
<style>#loginCanvas > :not(#loginLogo):not([alt="Agenda Mate"]){display:none !important;}</style>
<style>
#stickerLayer{position:absolute;inset:0;pointer-events:none;z-index:3;}
#notesStickers{position:absolute;inset:0;pointer-events:none;z-index:1;}
.app:not(.notes-open) #notesStickers{display:none !important;}
.pegado{position:absolute;width:72px;height:72px;transform:translate(-50%,-50%);pointer-events:auto;touch-action:none;background:none;border:0;padding:0;cursor:grab;}
.pegado img{width:100%;height:100%;object-fit:contain;pointer-events:none;}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="page" id="page">

    <header class="header" id="header">
      <div class="flower">
        <button class="flower-btn" id="flowerBtn" type="button" aria-label="Elegir diseño de florcita">
          <span class="flower-circle" id="flowerCircle"><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></span>
          <img id="flowerImg" alt="" hidden>
        </button>
        <!-- Placeholder: el diseño de la flor se reemplazará por los diseños elegibles -->
        <svg viewBox="0 0 60 60" width="56" height="56">
          <g fill="#C8B29C">
            <circle cx="30" cy="16" r="10"/>
            <circle cx="44" cy="30" r="10"/>
            <circle cx="30" cy="44" r="10"/>
            <circle cx="16" cy="30" r="10"/>
          </g>
          <circle cx="30" cy="30" r="6" fill="#FBF1E7"/>
        </svg>
      </div>

      <div class="center" id="dateBox">
        <div class="date-row">
          <button class="arrow" id="arrowUp" aria-label="Día siguiente">
            <svg class="ico" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
          </button>
          <div class="weekday" id="weekday"></div>
          <button class="arrow" id="arrowDown" aria-label="Día anterior">
            <svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
          </button>
        </div>
        <div class="month" id="month"></div>
        <button class="today-btn" id="todayBtn">HOY</button>
      </div>

      <div class="avatar" aria-hidden="true">
        <!-- Placeholder: la foto de perfil la elige cada usuario -->
        <img id="avatarImg" alt="Foto de perfil" hidden>
        <input type="file" id="profileInput" class="file-overlay" accept="image/*" aria-label="Elegir foto de perfil">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      </div>
    </header>

    <div class="body" id="bodyArea">
      <div class="left">
        <button class="check-start" id="checkStart" aria-label="Nueva tarea"></button>
        <button class="add-pill" id="addPill">
          <svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          Agregar cita o tarea
        </button>
        <div class="list" id="list"></div>
      </div>

      <div class="right">
        <div class="tools">
          <button class="tool active" id="calBtn" aria-label="Elegir fecha">
            <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          </button>
          <button class="tool" id="toolList" aria-label="Tareas y notas">
            <svg class="ico" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
          </button>
          <div class="tool-wrap"><button class="tool" id="toolImage" aria-label="Fotografías" type="button">
            <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 9"/></svg>
          </button>
          <input type="file" id="photoInput" class="file-overlay" accept="image/*" aria-label="Elegir foto">
          </div>
          <button class="tool" id="toolAccount" aria-label="Cuenta">
            <svg class="ico" viewBox="0 0 24 24"><circle cx="10" cy="8" r="4"/><path d="M3 21c.8-3.2 3.5-5 7-5"/><circle cx="18" cy="17" r="2.5"/><path d="M18 13.5v1M18 19.5v1M14.5 17h1M20.5 17h1"/></svg>
          </button>
          <button class="tool" id="toolPencil" aria-label="Dibujar">
            <svg class="ico" viewBox="0 0 24 24"><path d="M16 3l5 5L8 21H3v-5z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <section class="notes" id="notesPanel">
      <div id="notesStickers"></div>
      <div class="notes-head" id="notesHead">
        <span class="notes-title">NOTAS</span>
        <button class="note-up" id="notesUp" type="button" aria-label="Abrir notas"><svg class="ico" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        <button class="note-btn" id="textMode" hidden aria-label="Escribir con teclado">
          <svg class="ico" viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>
        </button>
        <button class="note-btn" id="clearDraw" hidden aria-label="Borrar dibujos">
          <svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
        </button>
        <button class="note-btn" id="closeNotes" hidden aria-label="Cerrar notas">
          <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <button class="note-btn" id="notesPencil" aria-label="Dibujar en notas">
          <svg class="ico" viewBox="0 0 24 24"><path d="M16 3l5 5L8 21H3v-5z"/></svg>
        </button>
      </div>
      <div class="notes-body" id="notesBody">
      <textarea id="notes" spellcheck="true"></textarea>
      <canvas id="drawCanvas" class="draw-canvas"></canvas>
    </div>
    </section>

    <div class="photo-layer" id="photoLayer"></div>

  </div>
</div>

<!-- Ventana emergente para agregar una cita o tarea -->
<div class="modal add-modal" id="addModal" hidden>
  <div class="form" role="dialog" aria-label="Nueva cita o tarea">
    <button type="button" class="date-pick" id="itemDateBtn" aria-label="Elegir fecha">
      <span id="itemDateLabel"></span>
      <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    </button>
    <input id="itemText" placeholder="Cita o tarea" maxlength="120" autocomplete="off">
    <input id="itemTime" placeholder="Horario (opcional, ej. 10:30)" maxlength="5" inputmode="numeric" autocomplete="off">
    <label class="alert-toggle">
      <input type="checkbox" id="itemAlert">
      <svg class="ico" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
      <span>Avisame ese día</span>
    </label>
    <p class="error" id="formError"></p>
    <div class="actions">
      <button class="btn ghost" id="cancelBtn">Cancelar</button>
      <button class="btn primary" id="saveBtn">Guardar</button>
    </div>
  </div>
</div>

<!-- Calendario -->
<div class="modal" id="calModal" hidden>
  <div class="sheet" role="dialog" aria-label="Elegir fecha">
    <div class="cal-head">
      <button class="cal-nav" id="calPrev" aria-label="Mes anterior">
        <svg class="ico" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <span class="cal-title" id="calTitle"></span>
      <button class="cal-nav" id="calNext" aria-label="Mes siguiente">
        <svg class="ico" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-foot">
      <button class="btn ghost" id="calToday">Hoy</button>
      <div class="cal-foot-right">
        <button class="btn ghost" id="calCancel">Cancelar</button>
        <button class="btn primary" id="calOk">Aceptar</button>
      </div>
    </div>
  </div>
</div>

<!-- Menú de cada cita: editar, tachar o eliminar -->
<div class="modal" id="itemMenu" hidden>
  <div class="sheet" role="dialog" aria-label="Opciones de la cita">
    <p class="menu-title" id="menuTitle"></p>
    <div class="menu-body" id="menuBody">
      <button class="menu-btn" id="menuEdit">Editar</button>
      <button class="menu-btn" id="menuToggle">Tachar</button>
      <button class="menu-btn danger" id="menuDelete">Eliminar</button>
      <button class="menu-btn" id="menuClose">Cerrar</button>
    </div>
    <div class="confirm-body" id="confirmBody" hidden>
      <p>¿Eliminar esta cita?</p>
      <div class="row-btns">
        <button class="menu-btn" id="confirmNo">No</button>
        <button class="menu-btn danger" id="confirmYes">Sí, eliminar</button>
      </div>
    </div>
  </div>
</div>

<!-- Ventana para editar una cita -->
<div class="modal add-modal" id="editModal" hidden>
  <div class="form" role="dialog" aria-label="Editar cita">
    <input id="editText" maxlength="120" autocomplete="off">
    <input id="editTime" placeholder="Horario (opcional, ej. 10:30)" maxlength="5" inputmode="numeric" autocomplete="off">
    <p class="error" id="editError"></p>
    <div class="actions">
      <button class="btn ghost" id="editCancel">Cancelar</button>
      <button class="btn primary" id="editSave">Guardar</button>
    </div>
  </div>
</div>


<div class="modal" id="flowerModal" hidden>
  <div class="sheet" role="dialog" aria-label="Elegir diseño de florcita">
    <div class="flower-grid" id="flowerGrid"></div>
    <div class="cal-foot"><button class="btn" id="stickerPaste" type="button" hidden>Pegar</button><button class="btn ghost" id="flowerClose">Cerrar</button></div>
  </div>
</div>

<div class="modal" id="stickerMenu" hidden>
  <div class="sheet" role="dialog" aria-label="Sticker">
    <div style="display:flex;flex-direction:column;gap:12px;padding:8px 0;">
      <button class="btn" id="stickerChange" type="button">Elegir otro</button>
      <button class="btn" id="stickerDelete" type="button">Borrar</button>
    </div>
    <div class="cal-foot"><span></span><button class="btn ghost" id="stickerMenuClose" type="button">Cerrar</button></div>
  </div>
</div>

<div class="login" id="loginScreen" style="background:#F5EFE9;background-image:none;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:auto;">
  <style>
    [hidden]{display:none !important;}
    #loginScreen input::placeholder{color:#FEFEFE;opacity:1;}
    #loginScreen button{transition:filter .12s ease, transform .12s ease;}
    #loginScreen button:active{filter:brightness(.7);transform:scale(.98);}
    #loginScreen input:focus{outline:none;}
    #loginScreen input{caret-color:#FEFEFE;color:#FEFEFE;}
    #loginScreen input:-webkit-autofill,#loginScreen input:-webkit-autofill:hover,#loginScreen input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px #AFB890 inset !important;box-shadow:0 0 0 1000px #AFB890 inset !important;-webkit-text-fill-color:#FEFEFE !important;caret-color:#FEFEFE;transition:background-color 9999s ease-in-out 0s;}
  </style>

<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  let KEY = 'agenda-web-v1';
  // ---------- Nube (Supabase) ----------
  // Si la librería no carga (red bloqueada), la agenda sigue andando y avisa en vez de quedarse muda
  const sb = null; // sin cuenta ni base en línea: todo se guarda en este navegador
  let sbUserId = null;
  let remoteReady = false;
  let pushTimer = null;
  function pushRemote() {
    if (!sb || !remoteReady || !sbUserId) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(async () => {
      try {
        const r = await sb.from('agenda_datos').upsert({ user_id: sbUserId, datos: data, actualizado: new Date().toISOString() });
        if (r.error) toast('No se pudo guardar en la nube. Revisá la conexión.');
      } catch (e) { toast('No se pudo guardar en la nube. Revisá la conexión.'); }
    }, 800);
  }
  const WEEKDAYS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  const MONTHS = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
  const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>';

  const $ = (s) => document.querySelector(s);
  const app = $('#app');
  const page = $('#page');
  const bodyArea = $('#bodyArea');

  // ---------- Datos ----------
  // Cada día guarda sus citas (items) y sus notas (notes). Todo queda en el navegador.
  function loadData() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d && typeof d === 'object') return { items: d.items || {}, notes: d.notes || {}, photos: d.photos || {}, drawings: d.drawings || {}, profile: d.profile || null, flower: d.flower || null, stickers: d.stickers || {}, theme: d.theme || 'tiza', sound: !!d.sound };
      }
    } catch (e) { /* no se pudo leer: empezamos vacío */ }
    return { items: {}, notes: {}, photos: {}, drawings: {}, profile: null, flower: null, stickers: {}, theme: 'tiza', sound: false };
  }
  let data = loadData();

  function saveData() {
    try {
      const s = JSON.stringify(data);
      localStorage.setItem(KEY, s);
      if (localStorage.getItem(KEY) !== s) throw new Error('verificación fallida');
      pushRemote();
    } catch (e) {
      toast('No se pudo guardar en este navegador. Avisame si pasa.');
    }
  }

  // ---------- Fechas ----------
  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
  function toKey(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function fromKey(k) {
    const [y, m, d] = k.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function longDate(k) {
    const d = fromKey(k);
    return WEEKDAYS[d.getDay()] + ' ' + d.getDate() + ' de ' + MONTHS[d.getMonth()].toLowerCase() + ' de ' + d.getFullYear();
  }

  // ---------- Utilidades ----------
  function normalizeTime(raw) {
    const m = raw.trim().match(/^(\d{1,2})[:.](\d{2})$/);
    if (!m) return null;
    const h = +m[1], mi = +m[2];
    if (h > 23 || mi > 59) return null;
    return String(h).padStart(2, '0') + ':' + String(mi).padStart(2, '0');
  }
  function sortItems(items) {
    return [...items].sort((a, b) => {
      if (a.hora && b.hora) return a.hora.localeCompare(b.hora) || a.creado - b.creado;
      if (a.hora) return -1;
      if (b.hora) return 1;
      return a.creado - b.creado;
    });
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // ---------- Estado de la vista ----------
  let current = startOfDay(new Date());
  const currentKey = () => toKey(current);

  // ---------- Render ----------
  function renderHeader() {
    renderAvatar();
    $('#weekday').textContent = WEEKDAYS[current.getDay()] + ' ' + current.getDate();
    $('#month').textContent = MONTHS[current.getMonth()].toUpperCase() + ' ' + current.getFullYear();
  }

  // ---------- Citas de Google Calendar (solo lectura) ----------
  let gToken = null;
  const calCache = {};
  async function fetchCalDay(k) {
    if (!gToken) return;
    const d = fromKey(k);
    const next = addDays(d, 1);
    const url = 'https://www.googleapis.com/calendar/v3/calendars/primary/events?singleEvents=true&orderBy=startTime'
      + '&timeMin=' + encodeURIComponent(d.toISOString()) + '&timeMax=' + encodeURIComponent(next.toISOString());
    try {
      const res = await fetch(url, { headers: { Authorization: 'Bearer ' + gToken } });
      if (res.status === 401) { gToken = null; delete calCache[k]; return; }
      if (!res.ok) { calCache[k] = []; return; }
      const j = await res.json();
      calCache[k] = (j.items || []).filter((ev) => ev.status !== 'cancelled').map((ev) => {
        const hora = ev.start && ev.start.dateTime
          ? (() => { const t = new Date(ev.start.dateTime); return String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0'); })()
          : '';
        return { id: 'g_' + ev.id, texto: ev.summary || '(sin título)', hora, gcal: true, creado: 0 };
      });
    } catch (e) { calCache[k] = []; return; }
    if (k === currentKey()) renderList();
  }

  function renderList() {
    renderAlert();
    const k = currentKey();
    if (gToken && calCache[k] === undefined) { calCache[k] = null; fetchCalDay(k); }
    const gItems = Array.isArray(calCache[k]) ? calCache[k] : [];
    const items = sortItems([...(data.items[k] || []), ...gItems]);
    const list = $('#list');
    if (!items.length) {
      list.innerHTML = '<p class="empty">No hay citas ni tareas para este día.</p>';
      return;
    }
    list.innerHTML = items.map((it, i) => `
      ${it.gcal ? `
      <div class="row gcal">
        <span class="time">${it.hora ? esc(it.hora) : ''}</span>
        <span class="bar" style="background:var(--blue)"></span>
        <span class="text">${esc(it.texto)}</span>
      </div>` : `
      <div class="row" data-id="${esc(it.id)}">
        <button class="check ${it.completada ? 'done' : ''}" data-id="${esc(it.id)}"
                aria-label="Marcar como completada" aria-pressed="${!!it.completada}">${it.completada ? CHECK : ''}</button>
        <span class="time">${it.hora ? esc(it.hora) : ''}</span>
        <span class="bar" style="background:${i % 2 === 0 ? 'var(--blue)' : 'var(--pink)'}"></span>
        <span class="text ${it.completada ? 'done' : ''}">${esc(it.texto)}</span>
      </div>`}`).join('');
  }

  function renderNotes() {
    $('#notes').value = data.notes[currentKey()] || '';
  }

  function renderAll() {
    renderHeader();
    renderList();
    renderNotes();
    renderPhotos();
    renderStickers();
  }

  // Cambio inmediato de día (calendario, HOY)
  function goTo(d) {
    current = startOfDay(d);
    renderAll();
  }

  // ---------- Cambio de día animado (estilo TikTok) ----------
  // dir > 0: día siguiente (la hoja sube). dir < 0: día anterior (la hoja baja).
  let busy = false;
  function slideDays(dir) {
    if (busy || notesState === 'open') return;
    busy = true;
    const h = app.clientHeight;
    page.style.transition = 'transform .28s ease';
    page.style.transform = `translateY(${-dir * h}px)`;
    setTimeout(() => {
      current = startOfDay(addDays(current, dir));
      renderAll();
      page.style.transition = 'none';
      page.style.transform = `translateY(${dir * h}px)`;
      void page.offsetHeight;
      page.style.transition = 'transform .28s ease';
      page.style.transform = 'translateY(0)';
      setTimeout(() => { busy = false; }, 290);
    }, 290);
  }
  const next = () => slideDays(1);
  const prev = () => slideDays(-1);

  // ---------- Gesto de deslizar con el dedo o el mouse ----------
  // Arriba: día siguiente. Abajo: día anterior. La hoja sigue al dedo y cambia al soltar.
  // No empieza en el texto de notas, campos, botones, ni en el panel de notas bajado.
  // Si la lista tiene más citas de las que entran, deslizar la desplaza y solo cambia de día
  // cuando llega al principio o al final.
  let notesState = 'normal';   // normal | open | collapsed
  let drag = null;

  function dragStart(x, y, target) {
    if (busy || !target || target.closest('textarea, input, button, .notes-head, .date-pick, .photo')) return null;
    if (notesState === 'open') return null;
    const scrollable = bodyArea.contains(target) && bodyArea.scrollHeight > bodyArea.clientHeight + 2;
    return {
      x, y, t: performance.now(), scrollable, dy: 0, moving: false,
      atTop: bodyArea.scrollTop <= 0,
      atBottom: bodyArea.scrollTop + bodyArea.clientHeight >= bodyArea.scrollHeight - 2,
    };
  }

  function dragMove(x, y) {
    if (!drag) return;
    const dx = x - drag.x, dy = y - drag.y;
    if (!drag.moving) {
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) { drag = null; return; } // gesto horizontal
      if (Math.abs(dy) < 8) return;
      const up = dy < 0;
      if (drag.scrollable) {
        if (up && !drag.atBottom) { drag = null; return; }
        if (!up && !drag.atTop) { drag = null; return; }
      }
      drag.moving = true;
    }
    drag.dy = dy;
    page.style.transition = 'none';
    page.style.transform = `translateY(${dy}px)`;
  }

  function dragEnd(x, y) {
    if (!drag) return;
    const d = drag;
    drag = null;
    if (!d.moving) return;
    const dy = d.dy;
    const dt = Math.max((performance.now() - d.t) / 1000, 0.05);
    const v = dy / dt;
    const up = dy < -80 || v < -600;
    const down = dy > 80 || v > 600;
    if (up || down) {
      busy = false;
      slideDays(up ? 1 : -1);
    } else {
      page.style.transition = 'transform .2s ease';
      page.style.transform = 'translateY(0)';
    }
  }

    if (e.target.closest('textarea, input, .date-pick')) return;
    if (bodyArea.contains(e.target) && bodyArea.scrollHeight > bodyArea.clientHeight + 2) {
      const atTop = bodyArea.scrollTop <= 0;
      const atBottom = bodyArea.scrollTop + bodyArea.clientHeight >= bodyArea.scrollHeight - 2;
      if (e.deltaY > 0 && !atBottom) return;   // la lista todavía se desplaza
      if (e.deltaY < 0 && !atTop) return;
    }
    e.preventDefault();
    // Un solo cambio de día por gesto: espera a que termine el movimiento de la rueda
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(() => { wheelAcc = 0; wheelLocked = false; }, 450);
    if (wheelLocked) return;
    wheelAcc += e.deltaY;
    if (Math.abs(wheelAcc) > 60) {

      p.w = Math.min(90, Math.max(12, photoDrag.w + dx));

      p.w = photoDrag.w;
      p.x = Math.min(100 - p.w, Math.max(0, photoDrag.x + dx));
      p.y = Math.min(95, Math.max(0, photoDrag.y + dy));

  // Reduce la foto a un tamaño liviano antes de guardarla en el navegador
  function compressImage(file, maxSide = 900) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          const s = Math.min(1, maxSide / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * s);
          c.height = Math.round(img.height * s);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', 0.8));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  let drawing = false;

  // Los trazos se guardan por día, en posiciones relativas (0 a 1), así se ven igual en cualquier tamaño
  function drawStyle() {
    dctx.lineCap = 'round';
    dctx.lineJoin = 'round';
    dctx.lineWidth = 2.5;
    dctx.strokeStyle = '#694329';
  }
  function redrawStrokes() {
    const r = drawCanvas.getBoundingClientRect();
    if (!r.width || !r.height) return;
    dctx.clearRect(0, 0, r.width, r.height);
    drawStyle();
    (data.drawings[currentKey()] || []).forEach((s) => {
      if (s.length < 2) return;
      dctx.beginPath();
      s.forEach((p, i) => {
        const x = p[0] * r.width, y = p[1] * r.height;
        if (i) dctx.lineTo(x, y); else dctx.moveTo(x, y);
      });
      dctx.stroke();
    });
  }
  function sizeDrawCanvas() {
    const r = drawCanvas.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const dpr = window.devicePixelRatio || 1;
    drawCanvas.width = Math.round(r.width * dpr);
    drawCanvas.height = Math.round(r.height * dpr);
    dctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redrawStrokes();
  }
  function normPoint(e) {
    const r = drawCanvas.getBoundingClientRect();
    return [
      Math.round((e.clientX - r.left) / r.width * 10000) / 10000,
      Math.round((e.clientY - r.top) / r.height * 10000) / 10000,
    ];
  }

    curStroke = [normPoint(e)];
    (data.drawings[k] = data.drawings[k] || []).push(curStroke);
  });
  drawCanvas.addEventListener('pointermove', (e) => {
    if (!curStroke) return;
    curStroke.push(normPoint(e));
    // Dibuja solo el último tramo, para que sea fluido
    const r = drawCanvas.getBoundingClientRect();
    const a = curStroke[curStroke.length - 2], b = curStroke[curStroke.length - 1];
    drawStyle();
    dctx.beginPath();
    dctx.moveTo(a[0] * r.width, a[1] * r.height);
    dctx.lineTo(b[0] * r.width, b[1] * r.height);
    dctx.stroke();
  });

  // Lápiz: entra y sale del modo dibujo. Al salir vuelve la escritura con teclado.
