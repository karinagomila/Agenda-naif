  let pendingSticker = null;
  let replaceIdx = null;
  function renderFlower() {
    applyTheme();
    const d = null; // el logo del encabezado queda fijo; los stickers se pegan en la hoja
    const img = $('#flowerImg');
    if (d) { img.src = d.src; img.hidden = false; $('#flowerCircle').hidden = true; }
    else { img.hidden = true; $('#flowerCircle').hidden = false; }
  }
  function openFlowerPicker() {
    $('#flowerGrid').innerHTML = (flowerPreview ? FLOWER_DESIGNS.slice(0, 4) : FLOWER_DESIGNS).map((d) => `
      <button class="flower-tile${d.id === pendingSticker ? ' sel' : ''}" data-design="${d.id}" aria-label="${d.name}">
        <img src="${d.src}" alt="">
      </button>`).join('');
    $('#stickerPaste').hidden = !pendingSticker;
    $('#flowerModal').hidden = false;
  }
  function closeFlowerPicker() { pendingSticker = null; replaceIdx = null; $('#flowerModal').hidden = true; }
  $('#flowerBtn').addEventListener('click', () => { flowerPreview = false; pendingSticker = null; replaceIdx = null; openFlowerPicker(); });
  $('#flowerClose').addEventListener('click', closeFlowerPicker);
  $('#flowerModal').addEventListener('click', (e) => { if (e.target === $('#flowerModal')) closeFlowerPicker(); });
  $('#flowerGrid').addEventListener('click', (e) => {
    const t = e.target.closest('.flower-tile');
    if (!t) return;
    if (flowerPreview) { showLoginPreview(t.dataset.design); closeFlowerPicker(); return; }
    const id = t.dataset.design;
    if (replaceIdx !== null) {
      const k = currentKey();
      if (data.stickers && data.stickers[k] && data.stickers[k][replaceIdx]) { data.stickers[k][replaceIdx].id = id; saveData(); }
      closeFlowerPicker();
      renderStickers();
      return;
    }
    pendingSticker = id;
    $('#flowerGrid').querySelectorAll('.flower-tile').forEach((x) => x.classList.toggle('sel', x === t));
    $('#stickerPaste').hidden = false;
  });

  // ---------- Stickers pegados en la hoja de cada día (y en las notas) ----------
  function renderStickers() {
    data.stickers = data.stickers || {};
    const lista = data.stickers[currentKey()] || [];
    const pintar = (cont, donde) => {
      if (!cont) return;
      cont.innerHTML = lista.map((s, i) => {
        if ((s.where || 'page') !== donde) return '';
        const d = FLOWER_DESIGNS.find((x) => x.id === s.id);
        return d ? `<button class="pegado" data-i="${i}" style="left:${s.x}%;top:${s.y}%" aria-label="${d.name}"><img src="${d.src}" alt=""></button>` : '';
      }).join('');
    };
    let layer = $('#stickerLayer');
    if (!layer) { layer = document.createElement('div'); layer.id = 'stickerLayer'; $('#page').appendChild(layer); }
    pintar(layer, 'page');
    pintar($('#notesStickers'), 'notes');
  }
  let stickerDrag = null;
  document.addEventListener('pointerdown', (e) => {
    const el = e.target.closest && e.target.closest('.pegado');
    if (!el) return;
    stickerDrag = { el, box: el.parentElement.getBoundingClientRect(), i: +el.dataset.i, x0: e.clientX, y0: e.clientY, moved: false, x: null, y: null };
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
  });
  document.addEventListener('pointermove', (e) => {
    if (!stickerDrag) return;
    if (!stickerDrag.moved && Math.hypot(e.clientX - stickerDrag.x0, e.clientY - stickerDrag.y0) < 6) return;
    stickerDrag.moved = true;
    const r = stickerDrag.box;
    stickerDrag.x = Math.min(100, Math.max(0, (e.clientX - r.left) / r.width * 100));
    stickerDrag.y = Math.min(100, Math.max(0, (e.clientY - r.top) / r.height * 100));
    stickerDrag.el.style.left = stickerDrag.x + '%';
    stickerDrag.el.style.top = stickerDrag.y + '%';
  });
  const endStickerDrag = () => {
    if (!stickerDrag) return;
    const d = stickerDrag; stickerDrag = null;
    if (d.moved) {
      const lista = (data.stickers && data.stickers[currentKey()]) || [];
      if (lista[d.i]) { lista[d.i].x = +d.x.toFixed(2); lista[d.i].y = +d.y.toFixed(2); saveData(); }
    } else {
      replaceIdx = d.i;
      $('#stickerMenu').hidden = false;
    }
  };
  document.addEventListener('pointerup', endStickerDrag);
  document.addEventListener('pointercancel', endStickerDrag);
  $('#stickerPaste').addEventListener('click', () => {
    if (!pendingSticker) return;
    data.stickers = data.stickers || {};
    const k = currentKey();
    const donde = app.classList.contains('notes-open') ? 'notes' : 'page';
    (data.stickers[k] = data.stickers[k] || []).push({ id: pendingSticker, x: 50, y: donde === 'notes' ? 40 : 45, where: donde });
    saveData();
    closeFlowerPicker();
    renderStickers();
  });
  $('#stickerChange').addEventListener('click', () => {
    $('#stickerMenu').hidden = true;
    pendingSticker = null;
    openFlowerPicker(); // replaceIdx sigue guardado: al elegir, reemplaza
  });
  $('#stickerDelete').addEventListener('click', () => {
    const k = currentKey();
    if (data.stickers && data.stickers[k] && replaceIdx !== null) { data.stickers[k].splice(replaceIdx, 1); saveData(); }
    replaceIdx = null;
    $('#stickerMenu').hidden = true;
    renderStickers();
  });
  $('#stickerMenuClose').addEventListener('click', () => { replaceIdx = null; $('#stickerMenu').hidden = true; });
  $('#stickerMenu').addEventListener('click', (e) => { if (e.target === $('#stickerMenu')) { replaceIdx = null; $('#stickerMenu').hidden = true; } });

  // ---------- Foto de perfil (la elige cada usuario) ----------
  function renderAvatar() {
    renderFlower();
    const img = $('#avatarImg');
    if (data.profile) { img.src = data.profile; img.hidden = false; } else { img.hidden = true; }
  }
  $('#profileInput').addEventListener('change', async () => {
    const input = $('#profileInput');
    const file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    try {
      data.profile = await compressImage(file, 300);
      saveData();
      renderAvatar();
    } catch (e) {
      toast('No se pudo cargar la foto de perfil.');
    }
  });

  // Botón de cuenta: su función se define en una etapa siguiente
  $('#toolAccount').addEventListener('click', () => {
    showAccName();
    renderThemeRow();
    $('#accountModal').hidden = false;
  });
  // Nombre de la cuenta: lo elige la persona; si no hay nombre, no se muestra nada
  function accUid() { return KEY.replace('agenda-web-v1:', ''); }
  function getAccName() { try { return localStorage.getItem('agenda-nombre:' + accUid()) || ''; } catch (e) { return ''; } }
  function showAccName() {
    const n = getAccName();
    $('#accUser').textContent = n;
    $('#accUser').hidden = !n;
  }
  $('#renameBtn').addEventListener('click', () => {
    const actual = getAccName();
    const nuevo = window.prompt('Tu nombre:', actual);
    if (nuevo === null) return;
    const limpio = nuevo.trim().slice(0, 40);
    try { if (limpio) localStorage.setItem('agenda-nombre:' + accUid(), limpio); else localStorage.removeItem('agenda-nombre:' + accUid()); } catch (e) {}
    showAccName();
  });
  $('#accountClose').addEventListener('click', () => { $('#accountModal').hidden = true; });
  $('#accountModal').addEventListener('click', (e) => { if (e.target === $('#accountModal')) $('#accountModal').hidden = true; });
  // Acciones de Personalizar
  const closeAccount = () => { $('#accountModal').hidden = true; };
  // Exportar e importar: pasar la agenda de un equipo a otro con un archivo
  $('#exportBtn').addEventListener('click', () => {
    try {
      const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
      const a = document.createElement('a');
      const hoy = new Date().toISOString().slice(0, 10);
      a.href = URL.createObjectURL(blob);
      a.download = 'agenda-mate-' + hoy + '.json';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast('Se descargó el archivo de la agenda.');
    } catch (e) { toast('No se pudo exportar. Probá de nuevo.'); }
  });
  $('#importBtn').addEventListener('click', () => { $('#importFile').click(); });
  $('#importFile').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    const lector = new FileReader();
    lector.onload = () => {
      let d;
      try { d = JSON.parse(lector.result); } catch (err) { toast('Ese archivo no es una agenda válida.'); return; }
      if (!d || typeof d !== 'object' || !d.items) { toast('Ese archivo no es una agenda válida.'); return; }
      if (!window.confirm('Esto reemplaza lo que hay en este equipo por lo del archivo. ¿Seguir?')) return;
      data = { items: d.items || {}, notes: d.notes || {}, photos: d.photos || {}, drawings: d.drawings || {}, profile: d.profile || null, flower: d.flower || null, theme: d.theme || 'tiza', sound: !!d.sound };
      saveData();
      renderAll();
      closeAccount();
      toast('Listo, se cargó la agenda del archivo.');
    };
    lector.readAsText(f);
  });
  $('#deleteAllBtn').addEventListener('click', () => {
    if (!window.confirm('¿Borrar toda la agenda? Esto no se puede deshacer.')) return;
    data = { ...data, items: {}, notes: {}, photos: {}, drawings: {} };
    saveData();
    renderAll();
    closeAccount();
    toast('Se borró toda la agenda.');
  });
  document.querySelectorAll('.acc-btn:not(#renameBtn):not(#logoutBtn):not(#changePassBtn):not(#deleteAllBtn)').forEach((b) => b.addEventListener('click', soon));

  // ---------- Ingreso (prueba): cuentas guardadas en este navegador ----------
  const ACCOUNTS_KEY = 'agenda-web-accounts';
  function loadAccounts() {
    try { return JSON.parse(localStorage.getItem(ACCOUNTS_KEY)) || {}; } catch (e) { return {}; }
  }
  function saveAccounts(a) {
    try { localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(a)); }
    catch (e) { toast('No se pudo guardar la cuenta en este navegador.'); }
  }
  const loginEl = $('#loginScreen');
  let loginUser = $('#loginUser'), loginPass = $('#loginPass');
  const loginPlace = (el, x, y, w, h) => { el.style.left = (x / 9.36) + 'cqw'; el.style.top = (y / 9.36) + 'cqw'; el.style.width = (w / 9.36) + 'cqw'; el.style.height = (h / 9.36) + 'cqw'; };
  const loginErr = $('#loginError'), loginBtn = $('#loginBtn');
  let loginMode = 'login';
  function setLoginMode(m) {
    loginMode = m;
            loginErr.textContent = '';
  }
  async function enterAgenda(uid, email) {
    sbUserId = uid;
    remoteReady = false;
    KEY = 'agenda-web-v1:' + uid;
    data = loadData();
    loginEl.hidden = true;
    loginPass.value = '';
    loginErr.textContent = '';
    renderAll();
    try {
      const r = await sb.from('agenda_datos').select('datos').eq('user_id', uid).maybeSingle();
      if (r.error) throw r.error;
      const d = r.data && r.data.datos;
      if (d && typeof d === 'object') {
        data = { items: d.items || {}, notes: d.notes || {}, photos: d.photos || {}, drawings: d.drawings || {}, profile: d.profile || null, flower: d.flower || null, theme: d.theme || 'tiza', sound: !!d.sound };
        try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
        renderAll();
      }
      remoteReady = true;
    } catch (e) {
      toast('No pude traer tus datos de la nube. Revisá la conexión.');
    }
  }
  function loginMsg(err) {
    const m = (err && err.message) || '';
    if (/invalid login/i.test(m)) return 'Usuario o contraseña incorrectos. Probá de nuevo.';
    if (/already registered|already exists|already been registered/i.test(m)) return 'Ya tenés cuenta. Volvé e ingresá con tu usuario y contraseña.';
    if (/password/i.test(m)) return 'La contraseña tiene que tener al menos 6 caracteres.';
    if (/email/i.test(m)) return 'Escribí un mail válido.';
    if (/fetch|network/i.test(m)) return 'No hay conexión. Revisá internet y probá de nuevo.';
    return 'No se pudo ingresar. Probá de nuevo en un rato.';
  }
  loginBtn.addEventListener('click', async () => {
    const mode = loginMode; // se lee antes de cualquier espera
    if (mode === 'recovery') {
      const nueva = $('#loginUserNew').value; // campo de arriba: escribir nueva
      const confirmar = $('#loginPassNew').value; // campo de abajo: confirmar
      if (nueva.length < 6) { loginErr.textContent = 'La contraseña tiene que tener al menos 6 caracteres.'; return; }
      if (nueva !== confirmar) { loginErr.textContent = 'Las contraseñas no coinciden.'; return; }
      if (!sb) { loginErr.textContent = 'No se pudo conectar. Revisá la conexión a internet y probá de nuevo.'; return; }
      loginErr.textContent = 'Un momento...';
      const r = await sb.auth.updateUser({ password: nueva });
      if (r.error || !r.data || !r.data.user) { loginErr.textContent = 'No se pudo guardar la contraseña. Pedí un link nuevo.'; return; }
      recoveryMode = false;
      setRecFlag(false);
      history.replaceState(null, '', window.location.pathname);
      enterAgenda(r.data.user.id, r.data.user.email);
      return;
    }
    const u = loginUser.value.trim().toLowerCase();
    const p = loginPass.value;
    if (!u || !p) { loginErr.textContent = 'Completá el mail y la contraseña.'; return; }
    if (!sb) { loginErr.textContent = 'No se pudo conectar. Revisá la conexión a internet y probá de nuevo.'; return; }
    loginErr.textContent = 'Un momento...';
    let res;
    try {
      res = mode === 'create'
        ? await sb.auth.signUp({ email: u, password: p })
        : await sb.auth.signInWithPassword({ email: u, password: p });
    } catch (e) { loginErr.textContent = loginMsg(e); return; }
    if (res.error) { loginErr.textContent = loginMsg(res.error); return; }
    if (mode === 'create' && !res.data.session) {
      loginErr.textContent = 'Te mandamos un mail. Tocá el link que te llega y después ingresá.';
      return;
    }
    if (!res.data.user) { loginErr.textContent = 'No se pudo ingresar. Probá de nuevo.'; return; }
    enterAgenda(res.data.user.id, res.data.user.email);
  });
  $('#loginPass').addEventListener('keydown', (e) => { if (e.key === 'Enter') loginBtn.click(); });
  $('#loginPassNew').addEventListener('keydown', (e) => { if (e.key === 'Enter') loginBtn.click(); });
  // Dos pantallas: ingreso (mail/Google/SOY NUEVO) y crear cuenta (con VOLVER)
  function showScreen(name) {
    const c = name === 'create';
    loginMode = c ? 'create' : 'login';
    loginUser = c ? $('#loginUserNew') : $('#loginUser');
    loginPass = c ? $('#loginPassNew') : $('#loginPass');
    document.querySelectorAll('.s-login').forEach((e) => { e.hidden = c; });
    document.querySelectorAll('.s-create').forEach((e) => { e.hidden = !c; });
    const b = $('#loginBtn');
    b.textContent = c ? 'CREAR CUENTA' : 'INGRESAR';
    if (c) loginPlace(b, 323, 1121, 290, 82); else loginPlace(b, 345, 1089, 246, 82);
    $('#loginScreen').style.setProperty('background-color', c ? '#E0E3D3' : '#F5EFE9', 'important');
    $('#loginCanvas').style.background = c ? '#E0E3D3' : '#F5EFE9';
    if (!c) $('#loginTitle').hidden = true;
    loginErr.textContent = '';
  }
  $('#chooseNew').addEventListener('click', () => showScreen('create'));
  $('#chooseBack').addEventListener('click', () => showScreen('login'));
  document.querySelectorAll('.js-google').forEach((btn) => btn.addEventListener('click', async () => {
    if (!sb) { loginErr.textContent = 'No se pudo conectar. Revisá la conexión a internet y probá de nuevo.'; return; }
    loginErr.textContent = 'Un momento...';
    const r = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + window.location.pathname, scopes: 'https://www.googleapis.com/auth/calendar.readonly' } });
    if (r.error) loginErr.textContent = 'No se pudo entrar con Google. Probá de nuevo.';
  }));
  $('#forgotUser').addEventListener('click', () => {
    loginErr.textContent = 'Tu usuario es el mail con el que creaste la cuenta.';
  });
  $('#forgotPass').addEventListener('click', async () => {
    const u = loginUser.value.trim().toLowerCase();
    if (!u) { loginErr.textContent = 'Escribí tu usuario (tu mail) y tocá de nuevo.'; return; }
    if (!sb) { loginErr.textContent = 'No se pudo conectar. Revisá la conexión a internet y probá de nuevo.'; return; }
    try {
      const r = await sb.auth.resetPasswordForEmail(u, { redirectTo: window.location.origin + window.location.pathname });
      loginErr.textContent = r.error ? 'No se pudo enviar el mail. Probá de nuevo en un rato.' : 'Te mandamos un mail para cambiar la contraseña.';
    } catch (e) { loginErr.textContent = 'No se pudo enviar el mail. Probá de nuevo en un rato.'; }
  });
  // Si ya hay cuentas guardadas, el botón principal es Ingresar; si no, Crear cuenta
  setLoginMode('login');
  // Ojito para ver u ocultar la contraseña (cerrado = oculta, abierto = se ve)
  (function () {
    const canvas = $('#loginCanvas');
    const stroke = 'stroke="#FEFEFE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"';
    const EYE_CLOSED = `<svg viewBox="0 0 24 24" width="100%" height="100%" ${stroke}><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>`;
    const EYE_OPEN = `<svg viewBox="0 0 24 24" width="100%" height="100%" ${stroke}><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>`;
    const mk = (inputId, centerY, scls) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = scls;
      btn.setAttribute('aria-label', 'Mostrar u ocultar contraseña');
      btn.style.cssText = `position:absolute;left:${790 / 9.36}cqw;top:${(centerY - 22) / 9.36}cqw;width:${44 / 9.36}cqw;height:${44 / 9.36}cqw;background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;`;
      btn.innerHTML = EYE_CLOSED;
      btn.addEventListener('click', () => {
        const inp = $('#' + inputId);
        const hidden = inp.type === 'password';
        inp.type = hidden ? 'text' : 'password';
        btn.innerHTML = hidden ? EYE_OPEN : EYE_CLOSED;
      });
      canvas.appendChild(btn);
      return btn;
    };
    mk('loginPass', 946, 's-login');
    mk('loginPassNew', 1026, 's-create');
    // Ojito del campo de arriba: solo se muestra en "nueva contraseña"
    const eyeTop = mk('loginUserNew', 860, '');
    eyeTop.id = 'eyeTopNew';
    eyeTop.hidden = true;
  })();
  showScreen('login');
  // Si la sesión quedó recordada, entra directo
  // Link del mail para cambiar la contraseña: se muestra "nueva contraseña", no la agenda
  // Se guarda en el navegador para que, si recarga la página antes de cambiar la contraseña, siga en "nueva contraseña"
  // Vence a los 15 minutos: así nunca queda trabada la entrada normal
  const REC_MAX_MS = 15 * 60 * 1000;
  const readRecFlag = () => {
    try {
      const t = Number(localStorage.getItem('agenda-recovery') || 0);
      if (t && Date.now() - t < REC_MAX_MS) return true;
      localStorage.removeItem('agenda-recovery');
    } catch (e) {}
    return false;
  };
  const setRecFlag = (on) => { try { if (on) localStorage.setItem('agenda-recovery', String(Date.now())); else localStorage.removeItem('agenda-recovery'); } catch (e) {} };
  let recoveryMode = /type=recovery/.test(window.location.hash) || readRecFlag();
  function enterRecovery() {
    recoveryMode = true;
    setRecFlag(true);
    showScreen('create');
    loginMode = 'recovery';
    $('#loginTitle').textContent = 'CREAR NUEVA USUARIO Y CONTRASEÑA';
    $('#loginTitle').hidden = false;
    $('#loginUserNew').type = 'password';
    $('#loginUserNew').placeholder = 'ESCRIBIR NUEVA CONTRASEÑA';
    $('#loginUserNew').value = '';
    $('#loginPassNew').value = '';
    $('#loginPassNew').placeholder = 'CONFIRMAR NUEVA CONTRASEÑA';
    $('#loginBtn').textContent = 'CREAR Y ENTRAR';
    loginPlace($('#loginBtn'), 316, 1121, 305, 82);
    $('#chooseBack').hidden = true;
    $('#eyeTopNew').hidden = false;
    $('#loginScreen').style.setProperty('background-color', '#E6D5C1', 'important');
    $('#loginCanvas').style.background = '#E6D5C1';
    const icons = document.querySelectorAll('#loginCanvas img.s-create');
    if (icons.length >= 2) icons[0].src = icons[1].src; // el dibujo tiene candado en los dos campos
  }
  if (recoveryMode) enterRecovery();
  if (sb) sb.auth.getSession().then(({ data: { session } }) => {
    if (session && session.provider_token) gToken = session.provider_token;
    if (session && session.user && !recoveryMode) enterAgenda(session.user.id, session.user.email);
  });
  if (sb) sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') { enterRecovery(); return; }
    if (session && session.provider_token) { gToken = session.provider_token; renderList(); }
  });
  $('#loginUserNew').addEventListener('keydown', (e) => { if (e.key === 'Enter') loginBtn.click(); });

  // Florcita de la pantalla de ingreso: muestra cuatro diseños para probar, sin guardar nada
  let flowerPreview = false;
  function showLoginPreview(id) {
    const d = FLOWER_DESIGNS.find((x) => x.id === id);
    if (!d) return;
    $('#loginLogo').src = d.src;
  }
  $('#loginCircle').addEventListener('click', () => { flowerPreview = true; openFlowerPicker(); });
  $('#loginCircle').addEventListener('keydown', (e) => { if (e.key === 'Enter') { flowerPreview = true; openFlowerPicker(); } });

  // Recordatorio de la cita para ese día (solo cuando estás parado en ese día)
  let alertDismissed = {};
  // Al guardar una cita no se muestra el cartel: solo al abrir el día
  let skipAlertNow = false;
  function renderAlertOld() {
    const k = currentKey();
    let box = $('#alertBanner');
    if (!box) {
      box = document.createElement('div');
      box.id = 'alertBanner';
      box.className = 'alert-banner';
      box.addEventListener('click', (e) => {
        if (e.target.closest('.alert-x')) { alertDismissed[currentKey()] = true; box.hidden = true; }
      });
      $('#list').parentNode.insertBefore(box, $('#list'));
    }
    const hits = (data.items[k] || []).filter((x) => x.aviso && !x.completada);
    if (!hits.length || alertDismissed[k]) { box.hidden = true; return; }
    box.hidden = false;
    const txt = hits.map((x) => (x.hora ? x.hora + ' ' : '') + x.texto).join(' · ');
    box.innerHTML = '<svg class="ico" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>' +
      '<span class="alert-text">No te olvides: ' + esc(txt) + '</span>' +
      '<button class="alert-x" aria-label="Cerrar aviso">×</button>';
  }
  $('#cancelBtn').addEventListener('click', () => { $('#itemAlert').checked = false; });

  $('#checkStart').addEventListener('click', () => $('#addPill').click());
  // Tocar el logo de la tapa muestra 4 stickers para elegir (vista previa, sin cuenta)
  $('#loginLogo').addEventListener('click', () => { $('#loginScreen').hidden = true; });
  // Flechita y barra de NOTAS: tocar sube la hoja, y si ya está arriba, la baja
  function toggleNotes() {
    setNotes(app.classList.contains('notes-open') ? 'collapsed' : 'open');
  }
  $('#notesUp').addEventListener('click', toggleNotes);
  $('#notesHead').addEventListener('click', (e) => {
    if (e.target.closest('button')) return;
    toggleNotes();
  });

  // Sonido suave al tocar botones (apagado por defecto; se prende desde el panel de cuenta)
  let audioCtx = null;
  function playClick() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(1500, t);
      o.frequency.exponentialRampToValueAtTime(900, t + 0.04);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.05, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.06);
    } catch (e) { /* sin sonido disponible */ }
  }
  function renderSound() {
    const b = $('#soundToggle');
    if (!b) return;
    const on = !!data.sound;
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.innerHTML = on
      ? '<svg class="ico" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>'
      : '<svg class="ico" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9l6 6M22 9l-6 6"/></svg>';
  }
  $('#soundToggle').addEventListener('click', () => {
    data.sound = !data.sound;
    saveData();
    renderSound();
    if (data.sound) playClick();
  });
  document.addEventListener('click', (e) => {
    if (data.sound && e.target.closest('button, .tool, .add-pill, .theme-tile')) playClick();
  }, true);

  // Cartel de recordatorio al abrir el día de la cita
  function renderAlert() {
    const k = currentKey();
    if (skipAlertNow) { skipAlertNow = false; return; }
    let modal = $('#alertModal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'alertModal';
      modal.className = 'alert-modal';
      modal.hidden = true;
      modal.innerHTML = '<div class="alert-card"><p class="alert-head">Acordate</p><div class="alert-body" id="alertBody"></div><button class="alert-ok" id="alertOk" type="button">Entendido</button></div>';
      document.body.appendChild(modal);
      const close = () => { alertDismissed[modal.dataset.key] = true; modal.hidden = true; };
      $('#alertOk').addEventListener('click', close);
      modal.addEventListener('click', (e) => { if (e.target === modal) close(); });
    }
    const hits = (data.items[k] || []).filter((x) => x.aviso && !x.completada);
    if (!hits.length || alertDismissed[k]) { modal.hidden = true; return; }
    modal.dataset.key = k;
    $('#alertBody').innerHTML = hits.map((x) => '<div>' + esc((x.hora ? x.hora + ' ' : '') + x.texto) + '</div>').join('');
    modal.hidden = false;
  }

  // Fondos de la hoja, elegidos por cada usuario en el panel de cuenta
  // Fondos de la hoja: lisos o con dibujitos chicos
  const THEMES = [
    { id: 'tiza', name: 'Tiza' },
    { id: 'liso-rosa', name: 'Rosa' },
    { id: 'liso-celeste', name: 'Celeste' },
    { id: 'liso-verde', name: 'Verde' },
    { id: 'liso-amarillo', name: 'Amarillo' },
    { id: 'liso-lila', name: 'Lila' },
  ];
  const THEMES_OLD = [
    { id: 'tiza', name: 'Tiza' },
    { id: 'tiza-puntos', name: 'Tiza con puntitos' },
    { id: 'celeste', name: 'Celeste claro' },
    { id: 'celeste-puntos', name: 'Celeste con puntitos' },
    { id: 'celeste-corazones', name: 'Celeste con corazones' },
  ];
  function applyTheme() {
    document.body.dataset.theme = data.theme || 'tiza';
  }
  function renderThemeRow() {
    renderSound();
    const cur = data.theme || 'tiza';
    $('#themeRow').innerHTML = THEMES.map((t) =>
      '<button class="theme-tile' + (cur === t.id ? ' sel' : '') + '" data-theme="' + t.id + '" aria-label="' + t.name + '" title="' + t.name + '"></button>'
    ).join('');
  }
  $('#themeRow').addEventListener('click', (e) => {
    const t = e.target.closest('.theme-tile');
    if (!t) return;
    data.theme = t.dataset.theme;
    saveData();
    applyTheme();
    renderThemeRow();
  });

  // ---------- Aviso breve ----------
  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
  }

  renderAll();
})();
</script>
</body>
</html>
