  let alertDismissed = {};
  // Al guardar una cita no se muestra el cartel: solo al abrir el día
  let skipAlertNow = false;
  function renderAlertOld() {
    const k = currentKey();
    let box = $('#alertBanner');
    if (!box) {
      box = document.createElement('div');
      box.id = 'alertBanner';
      box.className = 'alert-banner';
      box.addEventListener('click', (e) => {
        if (e.target.closest('.alert-x')) { alertDismissed[currentKey()] = true; box.hidden = true; }
      });
      $('#list').parentNode.insertBefore(box, $('#list'));
    }
    const hits = (data.items[k] || []).filter((x) => x.aviso && !x.completada);
    if (!hits.length || alertDismissed[k]) { box.hidden = true; return; }
    box.hidden = false;
    const txt = hits.map((x) => (x.hora ? x.hora + ' ' : '') + x.texto).join(' · ');
    box.innerHTML = '<svg class="ico" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>' +
      '<span class="alert-text">No te olvides: ' + esc(txt) + '</span>' +
      '<button class="alert-x" aria-label="Cerrar aviso">×</button>';
  }
  $('#cancelBtn').addEventListener('click', () => { $('#itemAlert').checked = false; });

  $('#checkStart').addEventListener('click', () => $('#addPill').click());
  // Tocar el logo de la tapa muestra 4 stickers para elegir (vista previa, sin cuenta)
  $('#loginLogo').addEventListener('click', () => { flowerPreview = true; openFlowerPicker(); });
  $('#logoutBtn').addEventListener('click', async () => {
    try { await sb.auth.signOut(); } catch (e) {}
    location.reload();
  });
  // Flechita y barra de NOTAS: tocar sube la hoja, y si ya está arriba, la baja
  function toggleNotes() {
    setNotes(app.classList.contains('notes-open') ? 'collapsed' : 'open');
  }
  $('#notesUp').addEventListener('click', toggleNotes);
  $('#notesHead').addEventListener('click', (e) => {
    if (e.target.closest('button')) return;
    toggleNotes();
  });

  // Sonido suave al tocar botones (apagado por defecto; se prende desde el panel de cuenta)
  let audioCtx = null;
  function playClick() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(1500, t);
      o.frequency.exponentialRampToValueAtTime(900, t + 0.04);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.05, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.06);
    } catch (e) { /* sin sonido disponible */ }
  }
  function renderSound() {
    const b = $('#soundToggle');
    if (!b) return;
    const on = !!data.sound;
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.innerHTML = on
      ? '<svg class="ico" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>'
      : '<svg class="ico" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9l6 6M22 9l-6 6"/></svg>';
  }
  $('#soundToggle').addEventListener('click', () => {
    data.sound = !data.sound;
    saveData();
    renderSound();
    if (data.sound) playClick();
  });
  document.addEventListener('click', (e) => {
    if (data.sound && e.target.closest('button, .tool, .add-pill, .theme-tile')) playClick();
  }, true);

  // Cartel de recordatorio al abrir el día de la cita
  function renderAlert() {
    const k = currentKey();
    if (skipAlertNow) { skipAlertNow = false; return; }
    let modal = $('#alertModal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'alertModal';
      modal.className = 'alert-modal';
      modal.hidden = true;
      modal.innerHTML = '<div class="alert-card"><p class="alert-head">Acordate</p><div class="alert-body" id="alertBody"></div><button class="alert-ok" id="alertOk" type="button">Entendido</button></div>';
      document.body.appendChild(modal);
      const close = () => { alertDismissed[modal.dataset.key] = true; modal.hidden = true; };
      $('#alertOk').addEventListener('click', close);
      modal.addEventListener('click', (e) => { if (e.target === modal) close(); });
    }
    const hits = (data.items[k] || []).filter((x) => x.aviso && !x.completada);
    if (!hits.length || alertDismissed[k]) { modal.hidden = true; return; }
    modal.dataset.key = k;
    $('#alertBody').innerHTML = hits.map((x) => '<div>' + esc((x.hora ? x.hora + ' ' : '') + x.texto) + '</div>').join('');
    modal.hidden = false;
  }

  // Fondos de la hoja, elegidos por cada usuario en el panel de cuenta
  // Fondos de la hoja: lisos o con dibujitos chicos
  const THEMES = [
    { id: 'tiza', name: 'Tiza' },
    { id: 'liso-rosa', name: 'Rosa' },
    { id: 'liso-celeste', name: 'Celeste' },
    { id: 'liso-verde', name: 'Verde' },
    { id: 'liso-amarillo', name: 'Amarillo' },
    { id: 'liso-lila', name: 'Lila' },
  ];
  const THEMES_OLD = [
    { id: 'tiza', name: 'Tiza' },
    { id: 'tiza-puntos', name: 'Tiza con puntitos' },
    { id: 'celeste', name: 'Celeste claro' },
    { id: 'celeste-puntos', name: 'Celeste con puntitos' },
    { id: 'celeste-corazones', name: 'Celeste con corazones' },
  ];
  function applyTheme() {
    document.body.dataset.theme = data.theme || 'tiza';
  }
  function renderThemeRow() {
    renderSound();
    const cur = data.theme || 'tiza';
    $('#themeRow').innerHTML = THEMES.map((t) =>
      '<button class="theme-tile' + (cur === t.id ? ' sel' : '') + '" data-theme="' + t.id + '" aria-label="' + t.name + '" title="' + t.name + '"></button>'
    ).join('');
  }
  $('#themeRow').addEventListener('click', (e) => {
    const t = e.target.closest('.theme-tile');
    if (!t) return;
    data.theme = t.dataset.theme;
    saveData();
    applyTheme();
    renderThemeRow();
  });

  // ---------- Aviso breve ----------
  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
  }

  renderAll();
})();
</script>
</body>
</html>
